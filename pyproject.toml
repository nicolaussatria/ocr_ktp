[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "card-ocr-api"
version = "1.8.0"
description = "Evidence-preserving server OCR for Indonesian KTP and business cards"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-api.txt"]}

[project.optional-dependencies]
demo = ["gradio==6.27.0"]

[tool.setuptools.packages.find]
include = ["card_ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: runs real OCR models on synthetic images"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# The type checker behind VS Code's Pylance. Run it with `npx pyright` (needs Node.js).
[tool.pyright]
include = ["card_ocr", "scripts", "tests", "app.py", "run_local.py", "setup_local.py"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
